name: Package contract

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out universal agent package
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Package manifest
        run: bash tests/manifest_test.sh
      - name: Canonical skill contract
        run: bash tests/skill_contract_test.sh
      - name: Client guides
        run: bash tests/client_guides_test.sh
      - name: Public server contract snapshot parity
        run: bash tests/server_compatibility_test.sh
      - name: Secretless workflow contract
        run: bash tests/workflow_contract_test.sh
